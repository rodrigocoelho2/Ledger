# Ledger on the NAS: the database deploy (runs once per "up" and exits), the WebApi and the Website.
# There is no SQL Server in this file: Ledger uses the shared one (container "shared-sql", network "sql-net"), like the
# other apps. db-deploy creates the Ledger database and its own "ledger" login there as sa; the WebApi only ever signs in
# as "ledger", which can't open the other apps' databases.
#
# Copy .env.example to .env next to this file and fill it in, then:  docker compose up -d --build
# (On the NAS the apps run as Portainer stacks: see "Deploying on the NAS" in the README.)

# The stack's name, fixed so the folder can be called anything: it prefixes the volume (ledger_keys), so the same name
# always finds the same data. Never change it on a running install.
name: ledger

services:
  # Publishes the database project (tables and stored procedures) and the ledger login, then exits: creates the Ledger
  # database the first time, applies schema changes on later deploys.
  db-deploy:
    build:
      context: .
      dockerfile: Ledger.Database/Dockerfile
    image: ledger-db-deploy:latest
    container_name: ledger-db-deploy
    restart: "no"
    networks:
      - sql-net
    environment:
      SQL_SERVER: ${SQL_SERVER:-shared-sql}
      SQL_DATABASE: Ledger
      SQL_USER: sa
      SQL_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env (the shared SQL Server's sa password)}
      SQL_APP_USER: ledger
      SQL_APP_PASSWORD: ${SQL_APP_PASSWORD:?Set SQL_APP_PASSWORD in .env (the ledger login's password)}
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # The engine: users, accounts, entries, the overview, the rental and the projects, the files. Not published on any
  # port: only the website reaches it, over the stack's own network. It reaches out only when set up to: to Enable
  # Banking (bank accounts, read only) and to Obol's WebApi over sql-net (the value of the investments).
  webapi:
    build:
      context: .
      dockerfile: Ledger.WebApi/Dockerfile
    image: ledger-webapi:latest
    container_name: ledger-webapi
    restart: unless-stopped
    depends_on:
      db-deploy:
        condition: service_completed_successfully
    networks:
      - default
      - sql-net
    environment:
      ConnectionStrings__Ledger: "Server=${SQL_SERVER:-shared-sql},1433;Database=Ledger;User Id=ledger;Password=${SQL_APP_PASSWORD};TrustServerCertificate=True"
      Ledger__ApiKey: ${LEDGER_API_KEY:?Set LEDGER_API_KEY in .env}
      Ledger__TimeZone: ${TIME_ZONE:-Europe/Lisbon}
      # true = the sample ledger in memory (user "demo", password "ledger-demo"); no database is touched.
      Ledger__DemoMode: ${LEDGER_DEMO_MODE:-false}
      # Bank accounts through Enable Banking (optional): the application id and its private key (the .pem in base64).
      Ledger__EnableBankingAppId: ${ENABLEBANKING_APP_ID:-}
      Ledger__EnableBankingKey: ${ENABLEBANKING_KEY:-}
      Ledger__BankSyncHours: ${BANK_SYNC_HOURS:-8}
      # The investments' value from Obol (optional): Obol's WebApi and its key (OBOL_API_KEY in Obol's .env).
      Ledger__ObolUrl: ${OBOL_URL:-http://obol-webapi:8080}
      Ledger__ObolApiKey: ${OBOL_API_KEY:-}
      DOTNET_gcServer: "0"
      TZ: ${TIME_ZONE:-Europe/Lisbon}
    cpus: ${LEDGER_CPUS:-1}
    mem_limit: ${LEDGER_WEBAPI_MEMORY:-384m}
    logging: *logging

  # Ledger (the app): http://<nas-ip>:5100 — and https://ledger.<your-domain> through Nginx Proxy Manager.
  website:
    build:
      context: .
      dockerfile: Ledger.Website/Dockerfile
    image: ledger-website:latest
    container_name: ledger-website
    restart: unless-stopped
    depends_on:
      - webapi
    ports:
      - "${LEDGER_PORT:-5100}:8080"
    environment:
      LedgerApi__Url: http://webapi:8080/
      LedgerApi__ApiKey: ${LEDGER_API_KEY:?Set LEDGER_API_KEY in .env}
      # Asked for only when creating the FIRST account (the admin), so nobody else on the network can claim it.
      Website__SetupKey: ${LEDGER_SETUP_KEY:?Set LEDGER_SETUP_KEY in .env}
      # false = only the first account can be created from the sign-in page.
      Website__AllowRegistration: ${LEDGER_ALLOW_REGISTRATION:-true}
      Website__DiscordClientId: ${DISCORD_CLIENT_ID:-}
      Website__DiscordClientSecret: ${DISCORD_CLIENT_SECRET:-}
      Website__TimeZone: ${TIME_ZONE:-Europe/Lisbon}
      DOTNET_gcServer: "0"
      TZ: ${TIME_ZONE:-Europe/Lisbon}
    cpus: ${LEDGER_CPUS:-1}
    mem_limit: ${LEDGER_WEBSITE_MEMORY:-384m}
    volumes:
      - keys:/keys                          # session keys: "keep me signed in" survives updates
    networks:
      - default                             # talks to the webapi
      - nas-net                             # Nginx Proxy Manager reaches it at http://ledger-website:8080
    logging: *logging

networks:
  default:      # private network of this stack (the WebApi is not on nas-net)
  # The shared SQL Server's network (created by the shared-sql stack).
  sql-net:
    name: sql-net
    external: true
  # Shared network on the NAS; create it once with:  docker network create nas-net
  nas-net:
    external: true

volumes:
  keys:
